[project]
proj_dir=E:/tool/pycharm_client/workspace/Hermes/

[client]
mini_path=C:/path/to/qmt/userdata_mini
; acc_list=***
acc_dict={'primary': {'id': 'ACCOUNT_ID', 'path': 'C:/path/to/qmt/userdata_mini'}}

is_test=1

[logging]
log_level = INFO
log_format = %(asctime)s - %(levelname)s - %(message)s
; log_file = logs/app.log
log_file = D:/tool/dataset/server_log/app.log
log_backup_count = 5


