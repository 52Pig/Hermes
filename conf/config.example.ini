; Hermes runtime configuration template.
; Copy to conf/config.ini and replace local account and path values before use.

[client]
mini_path = C:/path/to/qmt/userdata_mini
acc_dict = {'primary': {'id': 'ACCOUNT_ID', 'path': 'C:/path/to/qmt/userdata_mini'}}
is_test = 1

[logging]
log_level = INFO
log_format = %(asctime)s - %(levelname)s - %(message)s
log_file = D:/tool/dataset/server_log/app.log
log_backup_count = 5

[execution]
; Durable order ledger directory. Each account uses orders_<account_key>.sqlite3.
order_store_dir = D:/tool/dataset/strategy_positions

[strategy]
base_dir = D:/tool/dataset/strategy_positions
; name = ExampleStrategy
